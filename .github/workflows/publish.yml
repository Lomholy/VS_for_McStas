name: Publish to VS Code Marketplace and attach .vsix

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for Marketplace Trusted Publishing; no stored Personal Access Token
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # The release tag (v2.6.1 or 2.6.1) sets the published version; fails if it is not a valid version
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # vsce runs the vscode:prepublish compile step itself; --oidc needs vsce 4.1.0+ and Node 22+
      - run: npx --yes @vscode/vsce@4.1.0 publish --oidc

  # Attaches the .vsix to the release, for VSCodium and other offline installs
  vsix:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      # Writes vs-for-mcstas-<version>.vsix
      - run: npx --yes @vscode/vsce@4.1.0 package
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" vs-for-mcstas-*.vsix --repo "$GITHUB_REPOSITORY"
